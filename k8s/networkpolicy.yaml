# -----------------------------------------------------------
# NETWORK POLICY: restrict backend to frontend-only traffic
# -----------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-frontend-only
spec:
  podSelector:
    matchLabels:
      app: backend        # applies to backend pods
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend   # only pods labeled app=frontend may connect
      ports:
        - protocol: TCP
          port: 5000
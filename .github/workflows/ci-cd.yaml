name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: dockerthiru6/my-project-backend
  FRONTEND_IMAGE: dockerthiru6/my-project-frontend
  KIND_CLUSTER: calico-lab
  NAMESPACE: fullstack-dev

jobs:
  # Runs on GitHub's cloud runners - no access to your local cluster needed here.
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
  
  # Runs on YOUR machine (self-hosted runner in WSL), since that's where Kind lives.
  # Only fires on pushes to main - never on pull requests.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load new images into Kind
        run: |
          kind load docker-image ${{ env.BACKEND_IMAGE }}:latest --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.FRONTEND_IMAGE }}:latest --name ${{ env.KIND_CLUSTER }}

      - name: Update running Deployments to the new image tag
        run: |
          kubectl rollout restart deployment/backend-deployment -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/frontend-deployment -n ${{ env.NAMESPACE }}

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/backend-deployment -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend-deployment -n ${{ env.NAMESPACE }} --timeout=120s

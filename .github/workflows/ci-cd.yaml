name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: dockerthiru6/my-project-backend
  FRONTEND_IMAGE: dockerthiru6/my-project-frontend
  KIND_CLUSTER: calico-lab
  KIND_CLUSTERS: "calico-lab tf-lab"
  NAMESPACE: fullstack-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest images
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:latest
          docker pull ${{ env.FRONTEND_IMAGE }}:latest

      - name: Load new images into running Kind clusters
        run: |
          for c in $KIND_CLUSTERS; do
            if docker ps --format '{{.Names}}' | grep -qx "${c}-control-plane"; then
              kind load docker-image $BACKEND_IMAGE:latest --name $c
              kind load docker-image $FRONTEND_IMAGE:latest --name $c
            else
              echo "Skipping $c (not running)"
            fi
          done

      - name: Restart Deployments
        run: |
          for c in $KIND_CLUSTERS; do
            if docker ps --format '{{.Names}}' | grep -qx "${c}-control-plane"; then
              kind export kubeconfig --name $c
              kubectl --context kind-$c rollout restart deployment/backend-deployment -n $NAMESPACE
              kubectl --context kind-$c rollout restart deployment/frontend-deployment -n $NAMESPACE
            fi
          done

      - name: Wait for rollout to finish
        run: |
          for c in $KIND_CLUSTERS; do
            if docker ps --format '{{.Names}}' | grep -qx "${c}-control-plane"; then
              kubectl --context kind-$c rollout status deployment/backend-deployment -n $NAMESPACE --timeout=120s
              kubectl --context kind-$c rollout status deployment/frontend-deployment -n $NAMESPACE --timeout=120s
            fi
          done

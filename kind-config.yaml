kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: calico-lab
networking:
  disableDefaultCNI: true   # skip kindnet so Calico becomes the only CNI
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 32432   # matches your frontend-service nodePort
        hostPort: 32432
        protocol: TCP